services:
  python-server:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: voxel-python
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
    volumes:
      - public-data:/app/public/map
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.voxel-python.rule=Host(`voxel-api.ddns.net`)"
      - "traefik.http.routers.voxel-python.entrypoints=web,websecure"
      - "traefik.http.routers.voxel-python.tls=true"
      - "traefik.http.routers.voxel-python.tls.certresolver=letsencrypt"
      - "traefik.http.routers.voxel-python.priority=10"
      - "traefik.http.services.voxel-python.loadbalancer.server.port=8000"
      # Serves the playground (static assets from public/), /get_chunk, and the WebSocket at /ws/chunks.
      # Both voxel-api and voxel-playground domains route here so WS and assets share origin.
      - "traefik.http.routers.voxel-playground.rule=Host(`voxel-playground.ddns.net`)"
      - "traefik.http.routers.voxel-playground.entrypoints=web,websecure"
      - "traefik.http.routers.voxel-playground.tls=true"
      - "traefik.http.routers.voxel-playground.tls.certresolver=letsencrypt"
      - "traefik.http.routers.voxel-playground.priority=10"
      - "traefik.http.routers.voxel-playground.service=voxel-python"
      # Required for WebSocket upgrades through the reverse proxy.
      - "traefik.http.services.voxel-python.loadbalancer.passHostHeader=true"

volumes:
  public-data:
    driver: local

networks:
  web:
    external: true

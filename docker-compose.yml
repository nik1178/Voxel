version: '3.8'

services:
  node-server:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: voxel-node
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - public-data:/app/public/map
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.voxel-node.rule=Host(`voxel-playground.ddns.net`) && !(PathPrefix(`/ws`) || PathPrefix(`/get_chunk`))"
      - "traefik.http.routers.voxel-node.entrypoints=web,websecure"
      - "traefik.http.routers.voxel-node.tls=true"
      - "traefik.http.routers.voxel-node.tls.certresolver=letsencrypt"
      - "traefik.http.routers.voxel-node.priority=10"
      - "traefik.http.services.voxel-node.loadbalancer.server.port=8000"

  python-server:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: voxel-python
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
    volumes:
      - public-data:/app/public/map
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.voxel-python.rule=Host(`voxel-api.ddns.net`)"
      - "traefik.http.routers.voxel-python.entrypoints=web,websecure"
      - "traefik.http.routers.voxel-python.tls=true"
      - "traefik.http.routers.voxel-python.tls.certresolver=letsencrypt"
      - "traefik.http.routers.voxel-python.priority=10"
      - "traefik.http.services.voxel-python.loadbalancer.server.port=8000"
      # Route WS and chunk API paths from the playground host to this python backend (so WS works when page served from playground domain)
      - "traefik.http.routers.voxel-python-ws.rule=Host(`voxel-playground.ddns.net`) && (PathPrefix(`/ws`) || PathPrefix(`/get_chunk`))"
      - "traefik.http.routers.voxel-python-ws.entrypoints=web,websecure"
      - "traefik.http.routers.voxel-python-ws.tls=true"
      - "traefik.http.routers.voxel-python-ws.tls.certresolver=letsencrypt"
      - "traefik.http.routers.voxel-python-ws.priority=100"
      - "traefik.http.routers.voxel-python-ws.service=voxel-python"

volumes:
  public-data:
    driver: local

networks:
  web:
    external: true
